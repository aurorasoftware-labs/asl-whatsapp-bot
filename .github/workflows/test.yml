name: Aurora WhatsApp Bot checks

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check JavaScript syntax
        run: npm run check
      - name: Run unit tests
        run: npm test
      - name: Validate Oracle installer shell syntax
        run: bash -n deploy/oracle/setup.sh
